<div class="row">
    <div class="col-xs-12">
        {{ form_ajax('onSignin') }}
        <div class="ui form">
            <div class="fields">
                {#
                    Placeholder text is not a label: it disappears on input and
                    several screen readers ignore it entirely. Every field gets a
                    real <label> - visible, because the checklist asks for one.
                #}
                <div class="field email">
                    <label for="userSigninLogin">{{ loginAttributeLabel }} <span class="required-marker" aria-hidden="true">*</span></label>
                    <input
                        name="login"
                        type="text"
                        id="userSigninLogin"
                        required
                        aria-required="true"
                        autocomplete="{{ loginAttribute == 'username' ? 'username' : 'email' }}"
                        placeholder="Enter your {{ loginAttributeLabel|lower }}" />
                </div>
                <div class="field password">
                    <label for="userSigninPassword">Password <span class="required-marker" aria-hidden="true">*</span></label>
                    <input
                        name="password"
                        type="password"
                        id="userSigninPassword"
                        required
                        aria-required="true"
                        autocomplete="current-password"
                        placeholder="Enter your password" />
                </div>
            </div>
        </div>


        <div class="row mt-1">
            <div class="col-xs-12 col-sm remember-me-check">
                <div class="ui form remember-me" style="float: left;">
                    <div class="field inline align-items-baseline">
                        <input id="remember" name="remember" type="checkbox" value="1" />
                        <label for="remember">Remember me</label>
                        <span class="mark" aria-hidden="true"></span>
                    </div>
                </div>
            </div>
            <div class="col-xs-12 col-sm forgot-pw">
                <a class="no-padding btn-bold" style="float: right;" href="/forgot">Forgot your password?</a>
            </div>
        </div>

        <div class="col-xs-12 d-flex mt-1 center-xs">
            <button type="submit" class="btn btn-secondary">Sign in</button>
        </div>

        {{ form_close() }}
    </div>
</div>
